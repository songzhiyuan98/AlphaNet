name: Manual Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: Full SHA of a successful main CI release manifest.
        required: true
        type: string
      mode:
        description: Stage, stage then promote, or roll back to a known production SHA.
        required: true
        default: staging
        type: choice
        options:
          - staging
          - promote
          - break-glass-rollback
      confirm_production:
        description: Confirm an intentional production promotion or rollback.
        required: true
        default: false
        type: boolean
      confirm_schema_compatible:
        description: Confirm forward-only schema compatibility for break-glass rollback.
        required: true
        default: false
        type: boolean
      audit_reason:
        description: Required 20+ character reason for break-glass rollback.
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  resolve:
    name: Validate release manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      deploy_sha: ${{ steps.resolve.outputs.deploy_sha }}
      manifest_artifact: ${{ steps.resolve.outputs.manifest_artifact }}
      mode: ${{ steps.resolve.outputs.mode }}
      source_run_id: ${{ steps.resolve.outputs.source_run_id }}
      target: ${{ steps.resolve.outputs.target }}
    steps:
      - name: Check out trusted deployment tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Locate eligible CI release
        id: resolve
        env:
          AUDIT_REASON: ${{ inputs.audit_reason }}
          AWS_DEPLOY_ENABLED: ${{ vars.AWS_DEPLOY_ENABLED }}
          AWS_ECR_PUBLISH_ENABLED: ${{ vars.AWS_ECR_PUBLISH_ENABLED }}
          AWS_ECR_REGISTRY: ${{ vars.AWS_ECR_REGISTRY }}
          AWS_ECR_REPOSITORY_PREFIX: ${{ vars.AWS_ECR_REPOSITORY_PREFIX }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          CONFIRM_PRODUCTION: ${{ inputs.confirm_production }}
          CONFIRM_SCHEMA_COMPATIBLE: ${{ inputs.confirm_schema_compatible }}
          DEPLOY_MODE: ${{ inputs.mode }}
          DEPLOY_SHA: ${{ inputs.deploy_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/resolve-manual-release.sh

      - name: Preserve validated release manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.resolve.outputs.manifest_artifact }}
          overwrite: true
          path: |
            release/release-manifest.json
            release/release-manifest.sha256
          if-no-files-found: error
          retention-days: 30

  staging:
    name: Deploy staging
    if: >-
      needs.resolve.outputs.mode == 'staging' ||
      needs.resolve.outputs.mode == 'promote'
    needs:
      - resolve
    runs-on: ubuntu-latest
    timeout-minutes: 75
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out trusted deployment tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Download validated manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.resolve.outputs.manifest_artifact }}
          path: release

      - name: Validate staging deployment configuration
        env:
          DEPLOY_ROLE: ${{ vars.STAGING_AWS_DEPLOY_ROLE_ARN }}
          ECS_API_BASELINE_TASK_DEFINITION_ARN: ${{ vars.STAGING_ECS_API_BASELINE_TASK_DEFINITION_ARN }}
          ECS_API_SERVICE: ${{ vars.STAGING_ECS_API_SERVICE }}
          ECS_API_TASK_FAMILY: ${{ vars.STAGING_ECS_API_TASK_FAMILY }}
          ECS_CLUSTER: ${{ vars.STAGING_ECS_CLUSTER }}
          ECS_MCP_BASELINE_TASK_DEFINITION_ARN: ${{ vars.STAGING_ECS_MCP_BASELINE_TASK_DEFINITION_ARN }}
          ECS_MCP_SERVICE: ${{ vars.STAGING_ECS_MCP_SERVICE }}
          ECS_MCP_TASK_FAMILY: ${{ vars.STAGING_ECS_MCP_TASK_FAMILY }}
          ECS_MIGRATE_BASELINE_TASK_DEFINITION_ARN: ${{ vars.STAGING_ECS_MIGRATE_BASELINE_TASK_DEFINITION_ARN }}
          ECS_MIGRATE_TASK_FAMILY: ${{ vars.STAGING_ECS_MIGRATE_TASK_FAMILY }}
          ECS_RUNTIME_SMOKE_BASELINE_TASK_DEFINITION_ARN: ${{ vars.STAGING_ECS_RUNTIME_SMOKE_BASELINE_TASK_DEFINITION_ARN }}
          ECS_RUNTIME_SMOKE_TASK_FAMILY: ${{ vars.STAGING_ECS_RUNTIME_SMOKE_TASK_FAMILY }}
          ECS_SECURITY_GROUP_IDS: ${{ vars.STAGING_ECS_SECURITY_GROUP_IDS }}
          ECS_SUBNET_IDS: ${{ vars.STAGING_ECS_SUBNET_IDS }}
          ECS_WEB_BASELINE_TASK_DEFINITION_ARN: ${{ vars.STAGING_ECS_WEB_BASELINE_TASK_DEFINITION_ARN }}
          ECS_WEB_SERVICE: ${{ vars.STAGING_ECS_WEB_SERVICE }}
          ECS_WEB_TASK_FAMILY: ${{ vars.STAGING_ECS_WEB_TASK_FAMILY }}
          ECS_WORKER_BASELINE_TASK_DEFINITION_ARN: ${{ vars.STAGING_ECS_WORKER_BASELINE_TASK_DEFINITION_ARN }}
          ECS_WORKER_SERVICE: ${{ vars.STAGING_ECS_WORKER_SERVICE }}
          ECS_WORKER_TASK_FAMILY: ${{ vars.STAGING_ECS_WORKER_TASK_FAMILY }}
          PUBLIC_BASE_URL: ${{ vars.STAGING_PUBLIC_BASE_URL }}
          SMOKE_PATHS: ${{ vars.STAGING_SMOKE_PATHS }}
        run: |
          missing=()
          for variable_name in \
            DEPLOY_ROLE ECS_CLUSTER ECS_SUBNET_IDS ECS_SECURITY_GROUP_IDS \
            ECS_API_SERVICE ECS_API_BASELINE_TASK_DEFINITION_ARN ECS_API_TASK_FAMILY \
            ECS_MCP_SERVICE ECS_MCP_BASELINE_TASK_DEFINITION_ARN ECS_MCP_TASK_FAMILY \
            ECS_MIGRATE_BASELINE_TASK_DEFINITION_ARN ECS_MIGRATE_TASK_FAMILY \
            ECS_RUNTIME_SMOKE_BASELINE_TASK_DEFINITION_ARN ECS_RUNTIME_SMOKE_TASK_FAMILY \
            ECS_WORKER_SERVICE ECS_WORKER_BASELINE_TASK_DEFINITION_ARN ECS_WORKER_TASK_FAMILY \
            ECS_WEB_SERVICE ECS_WEB_BASELINE_TASK_DEFINITION_ARN ECS_WEB_TASK_FAMILY \
            PUBLIC_BASE_URL SMOKE_PATHS; do
            if [[ -z "${!variable_name}" ]]; then
              missing+=("$variable_name")
            fi
          done
          if [[ "${#missing[@]}" -gt 0 ]]; then
            echo "::error::Staging ECS variables are incomplete (${missing[*]}); no deployment was attempted."
            exit 1
          fi

      - name: Exchange GitHub OIDC token for staging deploy role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
          role-duration-seconds: 7200
          role-session-name: alphanet-manual-staging-${{ github.run_id }}
          role-to-assume: ${{ vars.STAGING_AWS_DEPLOY_ROLE_ARN }}

      - name: Deploy exact staging digests
        uses: ./.github/actions/deploy-ecs-release
        with:
          aws-region: ${{ vars.AWS_REGION }}
          deploy-sha: ${{ needs.resolve.outputs.deploy_sha }}
          ecs-cluster: ${{ vars.STAGING_ECS_CLUSTER }}
          ecs-subnet-ids: ${{ vars.STAGING_ECS_SUBNET_IDS }}
          ecs-security-group-ids: ${{ vars.STAGING_ECS_SECURITY_GROUP_IDS }}
          ecs-assign-public-ip: ${{ vars.STAGING_ECS_ASSIGN_PUBLIC_IP || 'DISABLED' }}
          api-service: ${{ vars.STAGING_ECS_API_SERVICE }}
          api-baseline-task-definition-arn: ${{ vars.STAGING_ECS_API_BASELINE_TASK_DEFINITION_ARN }}
          api-task-family: ${{ vars.STAGING_ECS_API_TASK_FAMILY }}
          mcp-service: ${{ vars.STAGING_ECS_MCP_SERVICE }}
          mcp-baseline-task-definition-arn: ${{ vars.STAGING_ECS_MCP_BASELINE_TASK_DEFINITION_ARN }}
          mcp-task-family: ${{ vars.STAGING_ECS_MCP_TASK_FAMILY }}
          migrate-baseline-task-definition-arn: ${{ vars.STAGING_ECS_MIGRATE_BASELINE_TASK_DEFINITION_ARN }}
          migrate-task-family: ${{ vars.STAGING_ECS_MIGRATE_TASK_FAMILY }}
          runtime-smoke-baseline-task-definition-arn: ${{ vars.STAGING_ECS_RUNTIME_SMOKE_BASELINE_TASK_DEFINITION_ARN }}
          runtime-smoke-task-family: ${{ vars.STAGING_ECS_RUNTIME_SMOKE_TASK_FAMILY }}
          web-service: ${{ vars.STAGING_ECS_WEB_SERVICE }}
          web-baseline-task-definition-arn: ${{ vars.STAGING_ECS_WEB_BASELINE_TASK_DEFINITION_ARN }}
          web-task-family: ${{ vars.STAGING_ECS_WEB_TASK_FAMILY }}
          worker-service: ${{ vars.STAGING_ECS_WORKER_SERVICE }}
          worker-baseline-task-definition-arn: ${{ vars.STAGING_ECS_WORKER_BASELINE_TASK_DEFINITION_ARN }}
          worker-task-family: ${{ vars.STAGING_ECS_WORKER_TASK_FAMILY }}
          expected-image-prefix: ${{ format('{0}/{1}', vars.AWS_ECR_REGISTRY, vars.AWS_ECR_REPOSITORY_PREFIX) }}
          expected-repository: ${{ github.repository }}
          manifest-path: release/release-manifest.json
          public-base-url: ${{ vars.STAGING_PUBLIC_BASE_URL }}
          smoke-paths: ${{ vars.STAGING_SMOKE_PATHS }}
          target-environment: staging

      - name: Record successful staging deployment
        run: |
          bash .github/scripts/create-deployment-marker.sh \
            staging \
            "${{ needs.resolve.outputs.deploy_sha }}" \
            release/release-manifest.json \
            "${{ needs.resolve.outputs.source_run_id }}" \
            "$GITHUB_RUN_ID" \
            manual-staging \
            "" \
            deployment-marker

      - name: Upload staging deployment marker
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-marker-staging-${{ needs.resolve.outputs.deploy_sha }}
          overwrite: true
          path: deployment-marker
          if-no-files-found: error
          retention-days: 90

  production:
    name: Deploy production
    if: >-
      always() &&
      needs.resolve.result == 'success' &&
      needs.resolve.outputs.target == 'production' &&
      (
        needs.resolve.outputs.mode == 'break-glass-rollback' ||
        needs.staging.result == 'success'
      )
    needs:
      - resolve
      - staging
    runs-on: ubuntu-latest
    timeout-minutes: 75
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out trusted deployment tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Download validated manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.resolve.outputs.manifest_artifact }}
          path: release

      - name: Validate production deployment configuration
        env:
          DEPLOY_ROLE: ${{ vars.PRODUCTION_AWS_DEPLOY_ROLE_ARN }}
          ECS_API_BASELINE_TASK_DEFINITION_ARN: ${{ vars.PRODUCTION_ECS_API_BASELINE_TASK_DEFINITION_ARN }}
          ECS_API_SERVICE: ${{ vars.PRODUCTION_ECS_API_SERVICE }}
          ECS_API_TASK_FAMILY: ${{ vars.PRODUCTION_ECS_API_TASK_FAMILY }}
          ECS_CLUSTER: ${{ vars.PRODUCTION_ECS_CLUSTER }}
          ECS_MCP_BASELINE_TASK_DEFINITION_ARN: ${{ vars.PRODUCTION_ECS_MCP_BASELINE_TASK_DEFINITION_ARN }}
          ECS_MCP_SERVICE: ${{ vars.PRODUCTION_ECS_MCP_SERVICE }}
          ECS_MCP_TASK_FAMILY: ${{ vars.PRODUCTION_ECS_MCP_TASK_FAMILY }}
          ECS_MIGRATE_BASELINE_TASK_DEFINITION_ARN: ${{ vars.PRODUCTION_ECS_MIGRATE_BASELINE_TASK_DEFINITION_ARN }}
          ECS_MIGRATE_TASK_FAMILY: ${{ vars.PRODUCTION_ECS_MIGRATE_TASK_FAMILY }}
          ECS_RUNTIME_SMOKE_BASELINE_TASK_DEFINITION_ARN: ${{ vars.PRODUCTION_ECS_RUNTIME_SMOKE_BASELINE_TASK_DEFINITION_ARN }}
          ECS_RUNTIME_SMOKE_TASK_FAMILY: ${{ vars.PRODUCTION_ECS_RUNTIME_SMOKE_TASK_FAMILY }}
          ECS_SECURITY_GROUP_IDS: ${{ vars.PRODUCTION_ECS_SECURITY_GROUP_IDS }}
          ECS_SUBNET_IDS: ${{ vars.PRODUCTION_ECS_SUBNET_IDS }}
          ECS_WEB_BASELINE_TASK_DEFINITION_ARN: ${{ vars.PRODUCTION_ECS_WEB_BASELINE_TASK_DEFINITION_ARN }}
          ECS_WEB_SERVICE: ${{ vars.PRODUCTION_ECS_WEB_SERVICE }}
          ECS_WEB_TASK_FAMILY: ${{ vars.PRODUCTION_ECS_WEB_TASK_FAMILY }}
          ECS_WORKER_BASELINE_TASK_DEFINITION_ARN: ${{ vars.PRODUCTION_ECS_WORKER_BASELINE_TASK_DEFINITION_ARN }}
          ECS_WORKER_SERVICE: ${{ vars.PRODUCTION_ECS_WORKER_SERVICE }}
          ECS_WORKER_TASK_FAMILY: ${{ vars.PRODUCTION_ECS_WORKER_TASK_FAMILY }}
          PUBLIC_BASE_URL: ${{ vars.PRODUCTION_PUBLIC_BASE_URL }}
          SMOKE_PATHS: ${{ vars.PRODUCTION_SMOKE_PATHS }}
        run: |
          missing=()
          for variable_name in \
            DEPLOY_ROLE ECS_CLUSTER ECS_SUBNET_IDS ECS_SECURITY_GROUP_IDS \
            ECS_API_SERVICE ECS_API_BASELINE_TASK_DEFINITION_ARN ECS_API_TASK_FAMILY \
            ECS_MCP_SERVICE ECS_MCP_BASELINE_TASK_DEFINITION_ARN ECS_MCP_TASK_FAMILY \
            ECS_MIGRATE_BASELINE_TASK_DEFINITION_ARN ECS_MIGRATE_TASK_FAMILY \
            ECS_RUNTIME_SMOKE_BASELINE_TASK_DEFINITION_ARN ECS_RUNTIME_SMOKE_TASK_FAMILY \
            ECS_WORKER_SERVICE ECS_WORKER_BASELINE_TASK_DEFINITION_ARN ECS_WORKER_TASK_FAMILY \
            ECS_WEB_SERVICE ECS_WEB_BASELINE_TASK_DEFINITION_ARN ECS_WEB_TASK_FAMILY \
            PUBLIC_BASE_URL SMOKE_PATHS; do
            if [[ -z "${!variable_name}" ]]; then
              missing+=("$variable_name")
            fi
          done
          if [[ "${#missing[@]}" -gt 0 ]]; then
            echo "::error::Production ECS variables are incomplete (${missing[*]}); no deployment was attempted."
            exit 1
          fi

      - name: Exchange GitHub OIDC token for production deploy role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-region: ${{ vars.AWS_REGION }}
          mask-aws-account-id: true
          role-duration-seconds: 7200
          role-session-name: alphanet-manual-production-${{ github.run_id }}
          role-to-assume: ${{ vars.PRODUCTION_AWS_DEPLOY_ROLE_ARN }}

      - name: Deploy exact production digests
        uses: ./.github/actions/deploy-ecs-release
        with:
          aws-region: ${{ vars.AWS_REGION }}
          deploy-sha: ${{ needs.resolve.outputs.deploy_sha }}
          deployment-mode: ${{ needs.resolve.outputs.mode == 'break-glass-rollback' && 'application-rollback' || 'forward' }}
          ecs-cluster: ${{ vars.PRODUCTION_ECS_CLUSTER }}
          ecs-subnet-ids: ${{ vars.PRODUCTION_ECS_SUBNET_IDS }}
          ecs-security-group-ids: ${{ vars.PRODUCTION_ECS_SECURITY_GROUP_IDS }}
          ecs-assign-public-ip: ${{ vars.PRODUCTION_ECS_ASSIGN_PUBLIC_IP || 'DISABLED' }}
          api-service: ${{ vars.PRODUCTION_ECS_API_SERVICE }}
          api-baseline-task-definition-arn: ${{ vars.PRODUCTION_ECS_API_BASELINE_TASK_DEFINITION_ARN }}
          api-task-family: ${{ vars.PRODUCTION_ECS_API_TASK_FAMILY }}
          mcp-service: ${{ vars.PRODUCTION_ECS_MCP_SERVICE }}
          mcp-baseline-task-definition-arn: ${{ vars.PRODUCTION_ECS_MCP_BASELINE_TASK_DEFINITION_ARN }}
          mcp-task-family: ${{ vars.PRODUCTION_ECS_MCP_TASK_FAMILY }}
          migrate-baseline-task-definition-arn: ${{ vars.PRODUCTION_ECS_MIGRATE_BASELINE_TASK_DEFINITION_ARN }}
          migrate-task-family: ${{ vars.PRODUCTION_ECS_MIGRATE_TASK_FAMILY }}
          runtime-smoke-baseline-task-definition-arn: ${{ vars.PRODUCTION_ECS_RUNTIME_SMOKE_BASELINE_TASK_DEFINITION_ARN }}
          runtime-smoke-task-family: ${{ vars.PRODUCTION_ECS_RUNTIME_SMOKE_TASK_FAMILY }}
          web-service: ${{ vars.PRODUCTION_ECS_WEB_SERVICE }}
          web-baseline-task-definition-arn: ${{ vars.PRODUCTION_ECS_WEB_BASELINE_TASK_DEFINITION_ARN }}
          web-task-family: ${{ vars.PRODUCTION_ECS_WEB_TASK_FAMILY }}
          worker-service: ${{ vars.PRODUCTION_ECS_WORKER_SERVICE }}
          worker-baseline-task-definition-arn: ${{ vars.PRODUCTION_ECS_WORKER_BASELINE_TASK_DEFINITION_ARN }}
          worker-task-family: ${{ vars.PRODUCTION_ECS_WORKER_TASK_FAMILY }}
          expected-image-prefix: ${{ format('{0}/{1}', vars.AWS_ECR_REGISTRY, vars.AWS_ECR_REPOSITORY_PREFIX) }}
          expected-repository: ${{ github.repository }}
          manifest-path: release/release-manifest.json
          public-base-url: ${{ vars.PRODUCTION_PUBLIC_BASE_URL }}
          smoke-paths: ${{ vars.PRODUCTION_SMOKE_PATHS }}
          target-environment: production

      - name: Record successful production deployment
        env:
          AUDIT_REASON: ${{ inputs.audit_reason }}
        run: |
          bash .github/scripts/create-deployment-marker.sh \
            production \
            "${{ needs.resolve.outputs.deploy_sha }}" \
            release/release-manifest.json \
            "${{ needs.resolve.outputs.source_run_id }}" \
            "$GITHUB_RUN_ID" \
            "${{ needs.resolve.outputs.mode }}" \
            "$AUDIT_REASON" \
            deployment-marker

      - name: Upload production deployment marker
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-marker-production-${{ needs.resolve.outputs.deploy_sha }}
          overwrite: true
          path: deployment-marker
          if-no-files-found: error
          retention-days: 90
