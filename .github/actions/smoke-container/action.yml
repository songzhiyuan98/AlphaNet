name: Smoke AlphaNet container
description: Verify each packaged runtime target before it can enter a release manifest.

inputs:
  image-ref:
    description: Local image tag or immutable registry digest to execute.
    required: true
  target:
    description: Dockerfile runtime target to smoke.
    required: true

runs:
  using: composite
  steps:
    - name: Import packaged API runtime
      if: inputs.target == 'api'
      shell: bash
      env:
        IMAGE_REF: ${{ inputs.image-ref }}
      run: |
        docker run --rm \
          --entrypoint node \
          "$IMAGE_REF" \
          --input-type=module \
          --eval "await import('./dist/app.js')"

    - name: Import packaged MCP runtime
      if: inputs.target == 'mcp'
      shell: bash
      env:
        IMAGE_REF: ${{ inputs.image-ref }}
      run: |
        docker run --rm \
          --entrypoint node \
          "$IMAGE_REF" \
          --input-type=module \
          --eval "await import('./dist/app.js')"

    - name: Check packaged Worker runtime
      if: inputs.target == 'worker'
      shell: bash
      env:
        IMAGE_REF: ${{ inputs.image-ref }}
      run: |
        docker run --rm \
          --entrypoint node \
          "$IMAGE_REF" \
          --check ./dist/main.js
        docker run --rm \
          --entrypoint node \
          "$IMAGE_REF" \
          --input-type=module \
          --eval "await import('./dist/worker.js'); await import('./dist/pending-action-worker.js')"

    - name: Check packaged AWS database release tooling
      if: inputs.target == 'migrate'
      shell: bash
      env:
        IMAGE_REF: ${{ inputs.image-ref }}
      run: |
        docker run --rm \
          --entrypoint /bin/bash \
          "$IMAGE_REF" \
          -ceu '
            files=(
              /opt/alphanet/certs/aws-rds-us-west-2-bundle.pem
              /opt/alphanet/db/aws/bootstrap.sql
              /opt/alphanet/db/aws/runtime-privileges.sql
              /opt/alphanet/db/aws/runtime-privileges-and-verify.sql
              /opt/alphanet/db/aws/runtime-smoke.sql
              /opt/alphanet/db/aws/verify-runtime-privileges.sql
              /opt/alphanet/db/load/seed-mvp-capacity.sql
              /opt/alphanet/db/operations/capacity-dataset-manifest.sql
              /opt/alphanet/db/operations/capacity-post-run-invariants.sql
              /opt/alphanet/db/operations/recovery-invariants.sql
              /opt/alphanet/db/operations/recovery-manifest.sql
              /opt/alphanet/db/scripts/aws-apply-runtime-privileges.sh
              /opt/alphanet/db/scripts/aws-bootstrap-database.sh
              /opt/alphanet/db/scripts/aws-migrate-release.sh
              /opt/alphanet/db/scripts/aws-smoke-runtime.sh
              /opt/alphanet/db/scripts/aws-test-runtime-acl-reconciliation.sh
              /opt/alphanet/db/scripts/aws-test-runtime-privilege-atomicity.sh
              /opt/alphanet/db/scripts/aws-verify-runtime-privileges.sh
              /opt/alphanet/db/scripts/migrate.sh
              /opt/alphanet/db/scripts/prepare-mvp-capacity-dataset.sh
              /opt/alphanet/db/scripts/verify-restored-backup.sh
            )
            for file in "${files[@]}"; do
              test -r "$file"
              test -s "$file"
            done
            for script in /opt/alphanet/db/scripts/*.sh; do
              /bin/bash -n "$script"
            done
          '

    - name: Start and probe packaged Web runtime
      if: inputs.target == 'web'
      shell: bash
      env:
        IMAGE_REF: ${{ inputs.image-ref }}
      run: |
        container_id="$(docker run --detach --env PORT=3000 "$IMAGE_REF")"
        cleanup() {
          docker rm --force "$container_id" >/dev/null 2>&1 || true
        }
        trap cleanup EXIT

        ready=false
        for _attempt in {1..30}; do
          if docker exec "$container_id" node \
            --input-type=module \
            --eval "const response = await fetch('http://127.0.0.1:3000/health'); if (!response.ok) process.exit(1)"; then
            ready=true
            break
          fi
          sleep 1
        done

        if [[ "$ready" != "true" ]]; then
          docker logs "$container_id"
          exit 1
        fi
