name: Build AlphaNet container
description: Build one Dockerfile target and optionally publish it to GHCR.

inputs:
  publish:
    description: Whether to authenticate and publish the image.
    required: true
  registry-password:
    description: GHCR credential; required only when publish is true.
    required: false
  registry-username:
    description: GHCR username; required only when publish is true.
    required: false
  target:
    description: Dockerfile target to build.
    required: true

outputs:
  digest:
    description: Registry digest returned by BuildKit when publishing.
    value: ${{ steps.build.outputs.digest }}
  repository:
    description: Lowercase GHCR image repository.
    value: ${{ steps.image.outputs.repository }}
  tag:
    description: Commit traceability tag.
    value: ${{ steps.image.outputs.tag }}

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Log in to GHCR
      if: inputs.publish == 'true'
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ghcr.io
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - name: Resolve image name
      id: image
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: |
        repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
        image_repository="ghcr.io/${repository}-${TARGET}"
        {
          echo "repository=$image_repository"
          echo "tag=${image_repository}:sha-${GITHUB_SHA}"
        } >> "$GITHUB_OUTPUT"

    - name: Build and optionally publish image
      id: build
      uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
      with:
        context: .
        file: ./Dockerfile
        target: ${{ inputs.target }}
        platforms: linux/amd64
        build-args: |
          APP_VERSION=${{ github.sha }}
        load: ${{ inputs.publish != 'true' }}
        push: ${{ inputs.publish }}
        tags: ${{ steps.image.outputs.tag }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=gha,scope=${{ inputs.target }}
        cache-to: type=gha,mode=max,scope=${{ inputs.target }}
        provenance: mode=max
        sbom: true
