name: Build AlphaNet container
description: Build one Dockerfile target and optionally publish it to GHCR.

inputs:
  publish:
    description: Whether to authenticate and publish the image.
    required: true
  registry-password:
    description: GHCR credential; required only when publish is true.
    required: false
  registry-username:
    description: GHCR username; required only when publish is true.
    required: false
  target:
    description: Dockerfile target to build.
    required: true

outputs:
  digest:
    description: Registry digest returned by BuildKit when publishing.
    value: ${{ steps.build.outputs.digest }}
  repository:
    description: Lowercase GHCR image repository.
    value: ${{ steps.image.outputs.repository }}
  tag:
    description: Commit traceability tag.
    value: ${{ steps.image.outputs.tag }}

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

    - name: Log in to GHCR
      if: inputs.publish == 'true'
      uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
      with:
        registry: ghcr.io
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - name: Resolve image name
      id: image
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: |
        repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
        image_repository="ghcr.io/${repository}-${TARGET}"
        {
          echo "repository=$image_repository"
          echo "tag=${image_repository}:sha-${GITHUB_SHA}"
        } >> "$GITHUB_OUTPUT"

    - name: Build and optionally publish image
      id: build
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        file: ./Dockerfile
        target: ${{ inputs.target }}
        platforms: linux/amd64
        build-args: |
          APP_VERSION=${{ github.sha }}
        load: ${{ inputs.publish != 'true' }}
        push: ${{ inputs.publish }}
        tags: ${{ steps.image.outputs.tag }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=gha,scope=${{ inputs.target }}
        cache-to: type=gha,mode=max,scope=${{ inputs.target }}
        # Docker's local image exporter cannot load the manifest list created by
        # attestations. Keep attestations on published images and disable them
        # only for the PR-only local-load path used by Trivy.
        provenance: ${{ inputs.publish == 'true' && 'mode=max' || 'false' }}
        sbom: ${{ inputs.publish == 'true' }}
