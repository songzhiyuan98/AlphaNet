# Local development only. Authentication is supplied by compose.yaml so the
# password does not live in this file.
bind 0.0.0.0
protected-mode yes
port 6379

dir /data
appendonly yes
appendfsync everysec

# Rate-limit state and short-lived coordination should fail visibly instead of
# silently evicting arbitrary keys. Application caches must always have a TTL.
maxmemory-policy noeviction

save 900 1
save 300 10
save 60 10000

loglevel notice
