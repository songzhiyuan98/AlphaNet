name: ${COMPOSE_PROJECT_NAME:-alphanet}

x-postgres-image: &postgres-image ${POSTGRES_IMAGE:-pgvector/pgvector:0.8.1-pg17-bookworm@sha256:3e8b3adfd27b5707128f60956f62a793c3c9326ea8cfaf0eab7adccb5d700b21}
x-redis-image: &redis-image ${REDIS_IMAGE:-redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952}

x-runtime-environment: &runtime-environment
  NODE_ENV: production
  TZ: UTC
  LOG_LEVEL: ${LOG_LEVEL:-debug}

x-data-service-environment: &data-service-environment
  <<: *runtime-environment
  DATABASE_URL: postgresql://${POSTGRES_USER:-alphanet}:${POSTGRES_PASSWORD:-alphanet_local_only}@postgres:5432/${POSTGRES_DB:-alphanet}
  REDIS_URL: redis://:${REDIS_PASSWORD:-alphanet_local_only}@redis:6379/0

x-app-base: &app-base
  restart: unless-stopped
  init: true
  networks:
    - alphanet

services:
  postgres:
    image: *postgres-image
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alphanet}
      POSTGRES_USER: ${POSTGRES_USER:-alphanet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-alphanet_local_only}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C
      ALPHANET_LOAD_SEED: ${ALPHANET_LOAD_SEED:-true}
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - idle_in_transaction_session_timeout=60000
      - -c
      - log_min_duration_statement=${POSTGRES_LOG_MIN_DURATION_MS:-500}
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db:/opt/alphanet/db:ro
      - ./infra/local/postgres-init.sh:/opt/alphanet/infra/postgres-init.sh:ro
      - ./infra/local/postgres-init.sql:/docker-entrypoint-initdb.d/010-alphanet-bootstrap.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready --quiet --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s
    shm_size: 256mb
    networks:
      - alphanet

  redis:
    image: *redis-image
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-alphanet_local_only}
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD:-alphanet_local_only}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
      - ./infra/local/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    stop_grace_period: 10s
    networks:
      - alphanet

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
      args:
        POSTGRES_IMAGE: *postgres-image
    profiles:
      - tools
      - app
      - api
      - web
      - worker
      - mcp
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-alphanet}
      PGUSER: ${POSTGRES_USER:-alphanet}
      PGPASSWORD: ${POSTGRES_PASSWORD:-alphanet_local_only}
      PGCONNECT_TIMEOUT: 5
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      - alphanet

  seed:
    image: *postgres-image
    profiles:
      - tools
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-alphanet}
      PGUSER: ${POSTGRES_USER:-alphanet}
      PGPASSWORD: ${POSTGRES_PASSWORD:-alphanet_local_only}
      PGCONNECT_TIMEOUT: 5
    entrypoint:
      - /bin/bash
      - /opt/alphanet/db/scripts/seed.sh
    volumes:
      - ./db:/opt/alphanet/db:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    networks:
      - alphanet

  api:
    <<: *app-base
    profiles:
      - app
      - api
      - web
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *data-service-environment
      # The app profile is a local environment even though it uses the production
      # image layout. Set API_NODE_ENV=production only with TLS, secure cookies,
      # a rotated secret, and Resend configuration.
      NODE_ENV: ${API_NODE_ENV:-development}
      PORT: 4000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:4000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-yKt8Jue5W_Q24xh6bP9FdM3Rav7CzsNe0GLi1TXUcAo}
      AGENT_API_KEY_PEPPER: ${AGENT_API_KEY_PEPPER:-h9mP6Lrz3dF5cQ8K7Vw2uX4aN1sJ0tYbEoGkUiZp}
      AGENT_API_KEY_PEPPER_VERSION: ${AGENT_API_KEY_PEPPER_VERSION:-1}
      AGENT_API_KEY_PREVIOUS_PEPPERS: ${AGENT_API_KEY_PREVIOUS_PEPPERS:-{}}
      AGENT_API_AUDIENCE: ${AGENT_API_AUDIENCE:-urn:alphanet:api:v1}
      AGENT_CREDENTIAL_ACTIVE_PER_AGENT: ${AGENT_CREDENTIAL_ACTIVE_PER_AGENT:-5}
      AGENT_CREDENTIAL_ACTIVE_PER_OWNER: ${AGENT_CREDENTIAL_ACTIVE_PER_OWNER:-20}
      AGENT_CREDENTIAL_ISSUE_PER_OWNER_24H: ${AGENT_CREDENTIAL_ISSUE_PER_OWNER_24H:-10}
      AGENT_CREDENTIAL_MUTATION_COOLDOWN_SECONDS: ${AGENT_CREDENTIAL_MUTATION_COOLDOWN_SECONDS:-30}
      AGENT_CREDENTIAL_DEFAULT_TTL_DAYS: ${AGENT_CREDENTIAL_DEFAULT_TTL_DAYS:-90}
      AGENT_CREDENTIAL_MAX_TTL_DAYS: ${AGENT_CREDENTIAL_MAX_TTL_DAYS:-365}
      PENDING_ACTION_ENCRYPTION_KEY: ${PENDING_ACTION_ENCRYPTION_KEY:-8f7d9c1e0b2a4d6f91c3e5a7b9d1f20436587a9cbed0f123456789abcdef0123}
      PENDING_ACTION_ENCRYPTION_KEY_VERSION: ${PENDING_ACTION_ENCRYPTION_KEY_VERSION:-1}
      PENDING_ACTION_PREVIOUS_ENCRYPTION_KEYS: ${PENDING_ACTION_PREVIOUS_ENCRYPTION_KEYS:-{}}
      COMMUNITY_CURSOR_SIGNING_KEY: ${COMMUNITY_CURSOR_SIGNING_KEY:-C4p8Vw2nR7xL9mQ3sT6yH1kD5fJ0aB8uE2zN7gS4}
      SEARCH_EMBEDDING_PROVIDER: ${SEARCH_EMBEDDING_PROVIDER:-disabled}
      SEARCH_EMBEDDING_MODEL_ID: ${SEARCH_EMBEDDING_MODEL_ID:-amazon.titan-embed-text-v2:0}
      SEARCH_EMBEDDING_DIMENSIONS: ${SEARCH_EMBEDDING_DIMENSIONS:-512}
      SEARCH_EMBEDDING_TIMEOUT_MS: ${SEARCH_EMBEDDING_TIMEOUT_MS:-5000}
      AUTH_TRUSTED_ORIGINS: ${AUTH_TRUSTED_ORIGINS:-http://localhost:3000}
      AUTH_SECURE_COOKIES: ${AUTH_SECURE_COOKIES:-false}
      API_TRUSTED_PROXY_CIDRS: ${API_TRUSTED_PROXY_CIDRS:-}
      SSR_INTERNAL_REQUEST_SECRET: ${SSR_INTERNAL_REQUEST_SECRET:-L8wq2Uox9sV7Gm1Xc4Kd6aJ0Ph5Rt3NyE1bZfQ7i}
      AUTH_DATABASE_POOL_MAX: ${AUTH_DATABASE_POOL_MAX:-5}
      AUTH_EMAIL_DAILY_GLOBAL_LIMIT: ${AUTH_EMAIL_DAILY_GLOBAL_LIMIT:-10000}
      AUTH_EMAIL_MODE: ${AUTH_EMAIL_MODE:-local-preview}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-}
      AUTH_EMAIL_REPLY_TO: ${AUTH_EMAIL_REPLY_TO:-}
      AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:-}
      AUTH_GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"

  web:
    <<: *app-base
    profiles:
      - app
      - web
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      api:
        condition: service_healthy
    environment:
      <<: *runtime-environment
      PORT: 3000
      API_INTERNAL_URL: http://api:4000
      SSR_ALLOW_MISSING_CLIENT_IP: "true"
      SSR_INTERNAL_REQUEST_SECRET: ${SSR_INTERNAL_REQUEST_SECRET:-L8wq2Uox9sV7Gm1Xc4Kd6aJ0Ph5Rt3NyE1bZfQ7i}
      GOOGLE_AUTH_ENABLED: ${GOOGLE_AUTH_ENABLED:-false}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"

  worker:
    <<: *app-base
    profiles:
      - app
      - worker
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *runtime-environment
      NODE_ENV: ${WORKER_NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-alphanet}:${POSTGRES_PASSWORD:-alphanet_local_only}@postgres:5432/${POSTGRES_DB:-alphanet}
      PENDING_ACTION_ENCRYPTION_KEY: ${PENDING_ACTION_ENCRYPTION_KEY:-8f7d9c1e0b2a4d6f91c3e5a7b9d1f20436587a9cbed0f123456789abcdef0123}
      PENDING_ACTION_ENCRYPTION_KEY_VERSION: ${PENDING_ACTION_ENCRYPTION_KEY_VERSION:-1}
      PENDING_ACTION_PREVIOUS_ENCRYPTION_KEYS: ${PENDING_ACTION_PREVIOUS_ENCRYPTION_KEYS:-{}}
      OUTBOX_CONSUMER_NAME: ${OUTBOX_CONSUMER_NAME:-alphanet-worker:v2}
      OUTBOX_REPLAY_FROM: ${OUTBOX_REPLAY_FROM:-2026-07-20T00:00:00.000Z}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-1000}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-20}
      SEARCH_EMBEDDING_PROVIDER: ${SEARCH_EMBEDDING_PROVIDER:-disabled}
      SEARCH_EMBEDDING_MODEL_ID: ${SEARCH_EMBEDDING_MODEL_ID:-amazon.titan-embed-text-v2:0}
      SEARCH_EMBEDDING_DIMENSIONS: ${SEARCH_EMBEDDING_DIMENSIONS:-512}
      SEARCH_EMBEDDING_TIMEOUT_MS: ${SEARCH_EMBEDDING_TIMEOUT_MS:-10000}
      SEARCH_INDEX_BATCH_SIZE: ${SEARCH_INDEX_BATCH_SIZE:-10}
      SEARCH_INDEX_LEASE_SECONDS: ${SEARCH_INDEX_LEASE_SECONDS:-60}
      RUN_ONCE: ${RUN_ONCE:-false}

  mcp:
    <<: *app-base
    profiles:
      - app
      - mcp
    build:
      context: .
      dockerfile: Dockerfile
      target: mcp
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: *runtime-environment
      REDIS_URL: redis://:${REDIS_PASSWORD:-alphanet_local_only}@redis:6379/0
      PORT: 4100
      MCP_ALLOWED_HOSTS: localhost,127.0.0.1,mcp
      MCP_PUBLIC_ENABLED: "false"
      MCP_TRUSTED_PROXY_CIDRS: ""
    ports:
      - "127.0.0.1:${MCP_PORT:-4100}:4100"

volumes:
  postgres-data:
  redis-data:

networks:
  alphanet:
    driver: bridge
